name: Deploy SOLESTYLE Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solestyle-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -e

          sudo -iu ec2-user bash <<'REMOTE'
          set -e
          cd /home/ec2-user/SOLESTYLE

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: EC2 repository has local changes. Deployment stopped."
            git status --short
            exit 1
          fi

          git fetch origin main
          git merge --ff-only origin/main

          cd backend
          npm ci --omit=dev

          pm2 restart solestyle-backend --update-env
          sleep 3
          pm2 describe solestyle-backend
          REMOTE
          SCRIPT
          )

          ENCODED_SCRIPT=$(printf '%s' "$DEPLOY_SCRIPT" | base64 | tr -d '\n')

          SSM_COMMAND="printf '%s' '$ENCODED_SCRIPT' | base64 -d | bash"

          PARAMETERS=$(jq -n --arg command "$SSM_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0080bdfdf3395de8d \
            --document-name AWS-RunShellScript \
            --comment "Deploy SOLESTYLE backend from GitHub Actions" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..120}; do
            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0080bdfdf3395de8d \
              --output json 2>/dev/null || true)

            STATUS=$(echo "$INVOCATION" | jq -r '.Status // empty')

            if [ "$STATUS" = "Success" ]; then
              echo "$INVOCATION" | jq -r '.StandardOutputContent'
              echo "Backend deployment successful!"
              exit 0
            fi

            case "$STATUS" in
              Failed|TimedOut|Cancelled|"Delivery Timed Out"|"Execution Timed Out")
                echo "$INVOCATION" | jq -r '.StandardOutputContent'
                echo "$INVOCATION" | jq -r '.StandardErrorContent'
                echo "Backend deployment failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment."
          exit 1
